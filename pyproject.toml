[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paios"
version = "0.1.0"
description = "PAIOS — governance-first AI control plane"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
azure = [
    "azure-identity>=1.19",
    "openai>=1.54",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/paios"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 90
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# str+Enum is deliberate: these values serialize directly into audit records
# and JSON policy files, and StrEnum changes format() behaviour.
ignore = ["UP042"]
