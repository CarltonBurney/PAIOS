# PAIOS development environment.
#
# One reproducible stack rather than independently installed services, so the
# environment matches the registry / workflow / audit architecture rather than
# drifting per machine.
#
#   postgres  durable operational data — registries, workflows, audit metadata
#   redis     session / cache tier
#   n8n       workflow engine, run from the official image (never from source)
#   paios     the control plane package
#
# Secrets are required, never defaulted: the `:?` syntax fails fast with a
# message rather than shipping a usable default password. Copy .env.example to
# .env and fill it in before the first `docker compose up`.

name: paios-dev

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-paios}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-paios}
      # Consumed by the init script to create n8n's separate database.
      N8N_DB_NAME: ${N8N_DB_NAME:-n8n}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      # Bound to loopback only — not reachable from the local network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-paios} -d ${POSTGRES_DB:-paios}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  n8n:
    # Official image. The source archive in Downloads is deliberately unused —
    # building n8n from source is not a supported deployment path.
    image: n8nio/n8n:${N8N_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-paios}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Encrypts stored credentials. Losing this makes saved credentials
      # unreadable, so keep it stable and out of source control.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env}
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      GENERIC_TIMEZONE: ${TZ:-UTC}
      N8N_DIAGNOSTICS_ENABLED: "false"
    volumes:
      - n8n-data:/home/node/.n8n
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"

  paios:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PAIOS_ENV: ${PAIOS_ENV:-dev}
      PAIOS_PROVIDER: ${PAIOS_PROVIDER:-mock}
      DATABASE_URL: postgresql://${POSTGRES_USER:-paios}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-paios}
      REDIS_URL: redis://redis:6379/0
      # Foundry is unset by default; the mock provider needs no cloud account.
      AZURE_AI_FOUNDRY_ENDPOINT: ${AZURE_AI_FOUNDRY_ENDPOINT:-}
      AZURE_AI_FOUNDRY_DEPLOYMENT: ${AZURE_AI_FOUNDRY_DEPLOYMENT:-}
    volumes:
      # Live source and policy documents, so edits take effect without rebuild.
      - ./src:/app/src
      - ./tests:/app/tests
      - ./policies:/app/policies

volumes:
  postgres-data:
  redis-data:
  n8n-data:
