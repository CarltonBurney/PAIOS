name: Validate Image Ingestion

on:
  push:
    paths:
      - 'apps/image-ingestion/**'
      - 'contracts/image-ingestion/**'
      - '.github/workflows/validate-image-ingestion.yml'
  pull_request:
    paths:
      - 'apps/image-ingestion/**'
      - 'contracts/image-ingestion/**'
      - '.github/workflows/validate-image-ingestion.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Contracts and Packet 1 unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r contracts/image-ingestion/acceptance/requirements.txt
          python -m pip install -e 'apps/image-ingestion[test]'

      - name: Validate contract package
        working-directory: contracts/image-ingestion
        run: python acceptance/validate_contracts.py

      - name: Record decoder library versions
        shell: python
        run: |
          import PIL, pillow_heif, pypdfium2
          from PIL import features
          print("pillow", PIL.__version__, "libavif", features.version("avif"))
          print("pillow-heif", pillow_heif.__version__, pillow_heif.libheif_info())
          print("pypdfium2", pypdfium2.version.PYPDFIUM_INFO, "pdfium", pypdfium2.version.PDFIUM_INFO)

      - name: Run unit tests
        working-directory: apps/image-ingestion
        run: python -m pytest -v
